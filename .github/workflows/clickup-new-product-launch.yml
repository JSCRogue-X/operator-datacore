name: ClickUp — New Product Launch Dates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-launch-dates:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set New Product launch dates
        run: npx tsx src/cli/clickup-new-product-launch.ts
